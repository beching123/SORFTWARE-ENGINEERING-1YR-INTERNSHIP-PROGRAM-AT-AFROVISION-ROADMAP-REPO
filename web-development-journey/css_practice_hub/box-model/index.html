<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: sans-serif;
      }
      p,
      ul {
        border: 2px solid rebeccapurple;
        padding: 0.2em;
      }

      .block,
      li {
        border: 2px solid blue;
        padding: 0.2em;
      }

      ul {
        display: inline-flex;
        list-style: none;
      }

      .block {
      }

      .box {
        border: 5px solid rebeccapurple;
        background-color: lightgray;
        padding: 40px;
        margin: 40px;
        width: 300px;
        height: 150px;
      }

      .alternate {
        box-sizing: border-box;
        width: 390px;
        height: 230px;
      }
      .containerr {
        border: 5px solid blue;
        margin: 40px;
      }

      .boxx {
        border: 5px solid rebeccapurple;
        background-color: lightgray;
        padding: 10px;
        height: 100px;
        /* try changing the margin properties: */
        margin-top: 40px;
        margin-right: 30px;
        margin-bottom: 40px;
        margin-left: 4em;
      }

      .containerrr {
        border: 5px solid blue;
        margin: 40px;
      }

      p {
        border: 5px solid rebeccapurple;
        background-color: lightgray;
        padding: 10px;
      }
      .one {
        margin-bottom: 50px;
      }

      .two {
        margin-top: -10px;
      }

      .containera {
        margin: 40px;
        padding: 20px;
        border-top: 5px dotted green;
        border-right: 1px solid black;
        border-bottom: 20px double rgb(23 45 145);
        padding: 20px;
      }

      .boxa {
        padding: 20px;
        background-color: lightgray;
        border: 1px solid #333333;
        border-top-style: dotted;
        border-right-width: 20px;
        border-bottom-color: hotpink;
        background-color: lightgray;
        padding-top: 0;
        padding-right: 30px;
        padding-bottom: 40px;
        padding-left: 4em;
      }.p {
        border: 2px solid rebeccapurple;
        width: 200px;
      }
      .span {
        margin: 20px 30px;
        padding: 10px 20px;
        width: 80px;
        height: 150px;
        background-color: lightblue;
        border: solid blue;
        border-width: 7px 1px;
      }
    </style>
  </head>
  <body>

      <li>Item Two</li>

    <p>
      I am another paragraph. Some of the <span class="block">words</span> have
      been wrapped in a <span>span element</span>.
    </p>

    <div class="container">
      <div class="boxx">Change my margin.</div>
    </div>

    <div class="box">I use the standard box model.</div>

    <div class="containerrr">
      <p class="one">I am paragraph one.</p>

    </div>

    <div class="containera">
      <div class="boxa">Change my borders.</div>
    </div> -->
    <p class="p">
      I am a paragraph and this is a <span class="span">span</span> inside that paragraph. A
      span is an inline element and so does not respect width and height.
    </p>
  </body>
</html>
