<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Form and Buttons test</h1>
    <form>
      <ul>
        <li>
          <label for="id">User ID</label>
          <input type="text" id="uid" name="uid" />
        </li>
        <br />
        <li>
          <label for="pwd">Enter Password: </label>
          <input type="password" id="pwd" name="pwd" />
        </li>
        <br />
        <li><button>Log in</button></li>
      </ul>
    </form>
    <br /><br />

    <form>
      <fieldset>
        <legend>Who is your favorite pony?</legend>
        <ul>
          <li>
            <input
              type="radio"
              id="pinkie"
              name="pony"
              value="pinkie"
              checked
            />
            <label for="pinkie">Pinkie Pie</label>
          </li>
          <li>
            <input
              type="radio"
              id="rainbow"
              name="pony"
              value="rainbow"
            /><label for="rainbow">Rainbow Dash</label>
          </li>
          <li>
            <input
              type="radio"
              id="twillight"
              name="pony"
              value="twilight"
            /><label for="twilight">Twilight Sparkle</label>
          </li>
        </ul>
      </fieldset>
      <fieldset>
        <legend>Hotdog preferences</legend>

        <ul>
          <li>
            <input type="checkbox" id="vegan" name="hotdog_vegan" />
            <label for="vegan">Vegan</label>
          </li>
          <li>
            <input type="checkbox" id="onions" name="hotdog_onions" />
            <label for="onions">Onions</label>
          </li>
          <li>
            <input type="checkbox" id="mustard" name="hotdog_mustard" />
            <label for="mustard">Mustard</label>
          </li>

          <li>
            <input type="checkbox" id="ketchup" name="hotdog_ketchup" />
            <label for="ketchup">Ketchup</label>
          </li>
        </ul>
      </fieldset>
      <button>Submit</button>
    </form>
    <br /><br />

    <form>
      <h2>Edit your preferences</h2>
      <ul>
        <li>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </li>
        <li>
          <label for="website">Website</label>
          <input type="url" id="website" name="website" />
        </li>
        <li>
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" />
        </li>
        <li>
          <label for="fave-color">Favorite color</label>
          <input type="color" id="fave-color" name="fave-color" />
        </li>
        <li>
          <button>Update preferences</button>
        </li>
      </ul>
    </form>

    <form>
      <ul>
        <li>
          <label for="food">Pick your favorite food:</label>
          <select name="food" id="food">
            <optgroup label="main">
              <option value="salad">Salad</option>
              <option value="curry">Curry</option>
              <option value="pizza">Pizza</option>
              <option value="fajitas">Fajitas</option>
            </optgroup>

            <optgroup label="snacks">
              <option value="biscuits">Biscuits</option>
              <option value="crisps">Crisps</option>
              <option value="fruits">Fruits</option>

              <option value="breadsticks">Breadsticks</option>
            </optgroup>
          </select>
        </li>
        <li>
          <button>Submit choice</button>
        </li>
      </ul>
    </form>

    <br /><br />

    <form>
      <fieldset>
        <legend>Personal details</legend>
        <ul>
          <li>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" />
          </li>
          <li>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" />
          </li>
        </ul>
      </fieldset>
      <fieldset>
        <legend>Comment information</legend>
        <ul>
          <li>
            <label for="comment">Comment:</label>
            <input type="text" id="comment" name="comment" />
          </li>
          <li>
            <label for="email">Email (include if you want a reply):</label>
            <input type="email" id="email" name="email" />
          </li>
        </ul>
      </fieldset>
    </form>
    <br /><br /><br />

    <form>
      <h2>Enter your support query</h2>
      <ul>
        <li>
          <label for="uname">User name:</label>
          <input
            type="text"
            name="uname"
            id="uname"
            required
            minlength="5"
            maxlength="20"
          />
        </li>
        <li>
          <label for="email">Email address:</label>
          <input type="email" name="email" id="email" required />
        </li>
        <li>
          <label for="phone">Phone number:</label>
          <input type="tel" name="phone" id="phone" required maxlength="15" />
        </li>
        <li>
          <label for="comment">Comment:</label>
          <textarea
            name="comment"
            id="comment"
            required
            maxlength="200"
          ></textarea>
        </li>
        <li>
          <button>Submit comment</button>
        </li>
      </ul>
    </form>
  </body>
</html>
