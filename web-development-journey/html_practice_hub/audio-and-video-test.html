<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Basic audio and video embed</h1>
    <audio controls>
      <source
        src="../learning-area/html/multimedia-and-embedding/tasks/audio-video/audio.mp3"
        type="audio/mp3"
      />
    </audio>

    <video controls width="320" height="240" muted>
      <source
        src="../learning-area/html/multimedia-and-embedding/tasks/audio-video/video.mp4"
        type="video/mp4"
      />
      <source
        src="../learning-area/html/multimedia-and-embedding/tasks/audio-video/video.webm"
        type="video/webm"
      />
      <track
        kind="subtitles"
        src="../learning-area/html/multimedia-and-embedding/tasks/audio-video/subtitles_en.vtt"
        srclang="en"
        label="English"
      />
    </video>
  </body>
</html>
